allure:
  environment:
    username: "****"
    password: "****"

  links:
    - type: custom
      name: Jira
      url: https://jira.example.com/browse/{}

  attachments:
    include:
      - text/html
      - image/png
      - image/jpeg
      - application/json

  # Плагины для фильтрации чувствительных данных
  plugins:
    - junit-xml-plugin
    - xunit-xml-plugin
    - trx-plugin
    - behaviors-plugin
    - packages-plugin
    - screen-diff-plugin
    - xctest-plugin
    - jasmine-plugin
    - junit-plugin
    - testng-plugin